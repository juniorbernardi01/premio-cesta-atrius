<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrius — Meu benefício</title>
<meta name="apple-mobile-web-app-title" content="Meu benefício">
<meta name="theme-color" content="#17479E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E %3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2317479E%22/%3E %3Crect x=%2212%22 y=%2226%22 width=%2240%22 height=%2226%22 rx=%223%22 fill=%22%23fff%22/%3E %3Crect x=%229%22 y=%2219%22 width=%2246%22 height=%2211%22 rx=%223%22 fill=%22%23fff%22/%3E %3Crect x=%2228%22 y=%2219%22 width=%228%22 height=%2233%22 fill=%22%2317479E%22/%3E %3Cpath d=%22M32 19c-4-9-14-8-14-2 0 3 3 4 6 4h8z%22 fill=%22%23fff%22/%3E %3Cpath d=%22M32 19c4-9 14-8 14-2 0 3-3 4-6 4h-8z%22 fill=%22%23fff%22/%3E %3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#17479E; --azul-fraco:#EEF3FC; --ciano:#0FA3DC; --vermelho:#D42027;
  --verde:#12864A; --verde-fraco:#E6F4EC; --amarelo:#8A6100; --amarelo-fraco:#FFF7E6;
  --texto:#1B2027; --cinza:#77818E; --linha:#E9ECF0; --fundo:#F5F6F8; --branco:#FFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--fundo);color:var(--texto);
  font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;padding-bottom:168px}
button{font-family:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--ciano);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

header{position:sticky;top:0;z-index:40;background:var(--branco);box-shadow:0 1px 0 var(--linha)}
.barra{display:flex;flex-direction:column;align-items:center;gap:4px;padding:13px 16px 9px;position:relative}
.marca{height:44px;width:auto;display:block}
.saudacao{font-size:14.5px;text-align:center;line-height:1.4}
.saudacao b{font-weight:700}
.saudacao .valor{color:var(--verde);font-weight:700}
.programa{font-size:12px;color:var(--cinza);text-align:center;letter-spacing:.02em}
.sair-topo{position:absolute;right:14px;top:14px;font-size:12.5px;color:var(--cinza);font-weight:500}
#btnAdmin{right:60px;color:var(--azul);font-weight:600}
#btnMeus{right:auto;left:14px;color:var(--azul);font-weight:600}


.busca{padding:10px 16px 0;position:relative}
.busca input{width:100%;border:0;background:var(--fundo);border-radius:11px;
  padding:12px 14px 12px 42px;font-size:15px;color:var(--texto)}
.busca svg{position:absolute;left:30px;top:21px;width:19px;height:19px;stroke:var(--cinza);fill:none;stroke-width:2}
.abas{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 16px 11px}
.abas::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;background:var(--fundo);color:var(--cinza);border-radius:999px;
  padding:8px 16px;font-size:13.5px;font-weight:600}
.aba[aria-pressed="true"]{background:var(--azul);color:var(--branco)}
.aba em{font-style:normal;font-weight:500;opacity:.65;margin-left:4px}

.barra-pedido.sem-saldo .trilho{display:none}
.barra-pedido.sem-saldo .saldo-linha{flex-wrap:wrap;row-gap:5px}
.selo-sem{display:inline-flex;align-items:center;gap:6px;background:var(--amarelo-fraco);
  border:1px solid #F1DFB8;color:var(--amarelo);border-radius:999px;
  padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.selo-sem::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
#saldoZero{display:flex;align-items:center;min-width:0}
#saldoZero[hidden],#saldoNormal[hidden],#saldoLinha[hidden]{display:none}
@media(max-width:380px){.selo-sem{font-size:12px;padding:4px 9px}}

.grupo{padding:18px 16px 2px}
.grupo h2{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--cinza)}
.lista{padding:6px 12px 0}
.item{display:flex;gap:13px;background:var(--branco);border-radius:14px;padding:12px;
  margin-bottom:9px;align-items:stretch}
.foto{width:88px;height:112px;flex-shrink:0;border-radius:10px;background:var(--fundo);
  display:grid;place-items:center;overflow:hidden;position:relative;padding:5px}
.foto img{width:100%;height:100%;object-fit:contain;display:block}
.foto svg{width:26px;height:26px;stroke:#C4CBD3;fill:none;stroke-width:1.5}
.lupa{position:absolute;right:5px;bottom:5px;width:20px;height:20px;border-radius:6px;
  background:rgba(27,32,39,.55);display:grid;place-items:center;pointer-events:none}
.lupa svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4}
.dados{flex:1;min-width:0;display:flex;flex-direction:column}
.dados h3{font-size:15px;font-weight:600;line-height:1.3}
.cod{font-size:12.5px;color:var(--cinza);margin-top:3px}
.rodape-item{margin-top:auto;padding-top:9px;display:flex;align-items:flex-end;gap:10px}
.preco{font-size:17px;font-weight:700;line-height:1.2}
.preco small{display:block;font-size:11.5px;font-weight:500;color:var(--cinza);margin-top:1px}
.acao{margin-left:auto}
.mais-btn{background:var(--azul);color:var(--branco);width:38px;height:38px;border-radius:10px;
  font-size:23px;line-height:1;display:grid;place-items:center}
.stepper{display:flex;align-items:center;background:var(--azul-fraco);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:38px;font-size:20px;color:var(--azul);font-weight:600}
.stepper b{min-width:26px;text-align:center;font-size:15px;font-weight:700}
.vazio{text-align:center;color:var(--cinza);padding:60px 20px}

.barra-pedido{position:fixed;left:0;right:0;bottom:0;z-index:45;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  background:var(--branco);box-shadow:0 -2px 12px rgba(20,30,50,.09)}
.barra-pedido.estourou{background:#FDECEC}
.pedido-int{max-width:720px;margin:0 auto}
.trilho{height:6px;background:#DDE3EC;border-radius:3px;overflow:hidden;margin-bottom:8px}
.trilho i{display:block;height:100%;background:var(--verde);border-radius:3px;transition:width .25s}
.barra-pedido.estourou .trilho{background:#F3CFCF}
.barra-pedido.estourou .trilho i{background:var(--vermelho)}
.saldo-linha{display:flex;font-size:13px;color:var(--cinza);gap:10px}
.saldo-linha b{color:var(--texto);font-weight:600}
.saldo-linha .direita{margin-left:auto;font-weight:600;color:var(--verde);white-space:nowrap}
.barra-pedido.estourou .saldo-linha .direita{color:var(--vermelho)}
.aviso-pagar{background:var(--vermelho);color:#fff;border-radius:8px;padding:9px 12px;
  font-size:13px;margin-top:9px;line-height:1.45}
.aviso-pagar b{font-weight:700}
.pedido-baixo{display:flex;align-items:center;gap:14px;margin-top:10px}
.resumo small{display:block;font-size:12px;color:var(--cinza)}
.resumo strong{font-size:19px;font-weight:700;color:var(--verde)}
.resumo.estourou strong{color:var(--vermelho)}
.ver{margin-left:auto;background:var(--azul);color:var(--branco);border-radius:11px;
  padding:13px 24px;font-size:15px;font-weight:600}
.ver:disabled{background:var(--linha);color:var(--cinza)}

.fundo-modal{position:fixed;inset:0;background:rgba(27,32,39,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo-modal.aberto{opacity:1;pointer-events:auto}
.painel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--fundo);z-index:70;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.painel.aberto{transform:none}
@media(prefers-reduced-motion:reduce){.painel,.barra-pedido,.trilho i{transition:none}}
.painel-topo{display:flex;align-items:center;gap:12px;padding:16px;background:var(--branco);box-shadow:0 1px 0 var(--linha)}
.painel-topo h2{font-size:17px;font-weight:600;flex:1}
.fechar{font-size:25px;line-height:1;color:var(--cinza)}
.painel-corpo{flex:1;overflow-y:auto;padding:16px}
.painel-pe{padding:16px;background:var(--branco);box-shadow:0 -1px 0 var(--linha)}
.carrinho-item{display:flex;gap:11px;background:var(--branco);border-radius:11px;padding:11px;margin-bottom:8px;align-items:center}
.carrinho-item .mini{width:46px;height:56px;flex-shrink:0;border-radius:7px;background:var(--fundo);
  overflow:hidden;padding:3px}
.carrinho-item .mini img{width:100%;height:100%;object-fit:contain}
.carrinho-item h4{font-size:14px;font-weight:600}
.carrinho-item .meta{font-size:12.5px;color:var(--cinza);margin-top:2px}
.carrinho-item .val{margin-left:auto;text-align:right;font-weight:700;font-size:14.5px}
.remover{color:var(--vermelho);font-size:12px;margin-top:4px;font-weight:500}

.sub{display:flex;font-size:13px;color:var(--cinza);margin-bottom:5px}
.sub span{margin-left:auto}
.total{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:600;
  padding-top:9px;margin-top:7px;border-top:1px solid var(--linha)}
.total strong{margin-left:auto;font-size:25px;font-weight:800;color:var(--verde)}
.total.estourou strong{color:var(--vermelho)}
.quadro{background:var(--branco);border-radius:11px;padding:13px 14px;margin-bottom:14px}
.quadro.alerta{background:#FDECEC}
.principal{width:100%;background:var(--azul);color:var(--branco);border-radius:11px;padding:15px;font-size:16px;font-weight:600}
.principal:disabled{background:var(--linha);color:var(--cinza)}
.secundario{width:100%;border:1px solid var(--linha);background:var(--branco);color:var(--texto);
  border-radius:11px;padding:12px;font-size:14px;font-weight:500;margin-top:9px}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--cinza)}
input,textarea{width:100%;border:1px solid var(--linha);border-radius:9px;padding:12px;
  font-family:inherit;font-size:16px;background:var(--branco);color:var(--texto)}
textarea{resize:vertical;min-height:64px}
select{width:100%;border:1px solid var(--linha);border-radius:9px;padding:12px;
  font-family:inherit;font-size:15px;background:var(--branco);color:var(--texto);
  appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2377818E' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:40px}
.campo{margin-bottom:14px}
.pagamentos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.forma{position:relative;border:1.5px solid var(--linha);background:var(--branco);color:var(--texto);
  border-radius:10px;padding:14px 10px;font-size:14px;font-weight:600;line-height:1.25;
  transition:background .15s,border-color .15s,color .15s}
.forma[aria-pressed="true"]{border-color:var(--azul);background:var(--azul);color:#fff}
.forma[aria-pressed="true"]::after{content:"✓";position:absolute;top:5px;right:8px;
  font-size:12px;font-weight:700;opacity:.9}
.previa{background:#F0F2F5;border-radius:9px;padding:11px 13px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;line-height:1.75;color:#4A5563;white-space:pre-wrap;word-break:break-word}
.rotulo-previa{font-size:12px;color:var(--cinza);margin:16px 0 6px}
.aviso{background:#FCEBEC;color:var(--vermelho);border-radius:9px;padding:11px;font-size:13.5px;margin-bottom:13px;font-weight:500}
.nota{font-size:12.5px;color:var(--cinza);margin-top:11px;line-height:1.5}
.ok{text-align:center;padding:20px 0}
.selo{width:60px;height:60px;border-radius:50%;background:var(--verde);color:var(--branco);
  display:grid;place-items:center;font-size:30px;margin:0 auto 16px}
.ok h2{font-size:19px;font-weight:600}

.entrada{position:fixed;inset:0;z-index:90;background:var(--branco);display:none;
  overflow-y:auto;padding:0 20px}
.entrada.aberta{display:block}
.entrada-int{max-width:380px;margin:0 auto;padding:52px 0 40px}
.entrada .marca{height:54px;margin:0 auto 26px}
.entrada h1{font-size:20px;font-weight:700;text-align:center;margin-bottom:6px}
.entrada .sub-t{font-size:13.5px;color:var(--cinza);text-align:center;margin-bottom:28px;line-height:1.5}
.grupo-mes{margin-bottom:20px}
.grupo-mes h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--cinza);margin-bottom:9px}
.hist{width:100%;display:flex;align-items:center;gap:12px;background:var(--branco);
  border-radius:11px;padding:13px;margin-bottom:8px;text-align:left}
.hist b{font-size:14px;font-weight:600}
.hist small{display:block;font-size:12.5px;color:var(--cinza);margin-top:2px}
.hist .valor{margin-left:auto;font-size:15px;font-weight:700}
.quem{font-size:15px;font-weight:600;text-align:center;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid var(--linha)}
.senha-campo{position:relative}
.senha-campo input{padding-right:44px}
.olho{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:8px;font-size:15px;opacity:.5}

.visor{position:fixed;inset:0;z-index:95;background:rgba(15,19,24,.93);display:none;flex-direction:column}
.visor.aberto{display:flex}
.visor-topo{display:flex;justify-content:flex-end;padding:12px 14px}
.visor-fechar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  font-size:24px;display:grid;place-items:center}
.visor-img{flex:1;display:grid;place-items:center;padding:0 20px;min-height:0}
.visor-img img{max-width:100%;max-height:100%;object-fit:contain}
.visor-pe{background:var(--branco);border-radius:20px 20px 0 0;padding:18px 18px 22px}
.visor-pe h3{font-size:17px;font-weight:700}
.visor-linha{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
.visor-linha .acao{margin-left:auto}
.visor-linha .mais-btn{width:auto;padding:0 20px;height:44px;font-size:15px;font-weight:600}
.visor-linha .stepper button{width:44px;height:44px}
.admin{position:fixed;inset:0;z-index:75;background:var(--fundo);display:none}
.admin.aberta{display:flex}

.lateral{width:238px;flex-shrink:0;background:#12336F;color:#fff;display:flex;flex-direction:column;
  transition:width .2s;z-index:2}
.lateral-topo{display:flex;align-items:center;gap:10px;padding:18px 14px 16px}
.lateral-marca{height:42px;width:auto;display:block;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.28))}
.lateral-recolher{margin-left:auto;width:34px;height:34px;border-radius:8px;display:grid;
  place-items:center;color:#fff;background:rgba(255,255,255,.1);flex-shrink:0}
.lateral-recolher svg,.hamburguer svg{width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round}
.lateral-itens{flex:1;padding:8px;overflow-y:auto}
.lateral-pe{padding:8px;border-top:1px solid rgba(255,255,255,.12)}
.lateral-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;
  border-radius:9px;color:rgba(255,255,255,.78);font-size:14px;font-weight:500;text-align:left;
  margin-bottom:2px}
.lateral-item svg{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lateral-item:hover{background:rgba(255,255,255,.09);color:#fff}
.lateral-item[aria-current="page"]{background:#fff;color:var(--azul);font-weight:600}
.lateral-fundo{display:none}

.admin.recolhida .lateral{width:76px}
.admin.recolhida .lateral-item span{display:none}
/* recolhido: logo em cima, botão embaixo */
.admin.recolhida .lateral-topo{flex-direction:column;gap:12px;padding:16px 8px 14px}
.admin.recolhida .lateral-marca{height:auto;width:58px}
.admin.recolhida .lateral-recolher{margin:0}
.admin.recolhida .lateral-item{justify-content:center;padding:11px 0}

.admin-lado{flex:1;display:flex;flex-direction:column;min-width:0}
.admin-barra{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--branco);
  border-bottom:1px solid var(--linha);flex-shrink:0}
.admin-barra h1{font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.admin-quem{font-size:13px;color:var(--cinza)}
.hamburguer{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--linha);
  place-items:center;color:var(--texto);flex-shrink:0}
.admin-corpo{flex:1;overflow-y:auto;padding:22px 20px 44px}
.admin-int{max-width:920px;margin:0 auto}
.admin-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.admin-cab h2{font-size:19px;font-weight:700;margin-right:auto;letter-spacing:-.01em}
.btn{background:var(--branco);border:1px solid var(--linha);color:var(--texto);border-radius:9px;
  padding:10px 16px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#C9D2DD;background:#FBFCFD}
.btn.azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.perigo{color:var(--vermelho);border-color:#F3CFCF}
.filtro-linha{display:flex;gap:10px;margin-bottom:14px}
.filtro-linha input{flex:1;padding:11px 13px;font-size:14.5px;min-width:0}
.filtro-linha select{width:auto;min-width:168px;padding:11px 40px 11px 13px;font-size:14.5px}

@media(max-width:860px){
  .hamburguer{display:grid}
  .lateral{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);
    transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .admin.menu-aberto .lateral{transform:none}
  .admin.menu-aberto .lateral-fundo{display:block;position:fixed;inset:0;background:rgba(15,22,35,.5);z-index:1}
  .admin.recolhida .lateral{width:238px}
  .admin.recolhida .lateral-topo{flex-direction:row;gap:10px;padding:20px 16px 18px}
  .admin.recolhida .lateral-marca{height:46px;width:auto}
  .admin.recolhida .lateral-recolher{margin-left:auto}
  .admin.recolhida .lateral-item span{display:block}
  .admin.recolhida .lateral-item{justify-content:flex-start;padding:11px 12px}
  .admin-corpo{padding:16px 14px 40px}
  .admin-barra{padding:11px 14px}
  .admin-cab h2{width:100%;margin-bottom:2px}
  .admin-cab .btn{flex:1}
  .filtro-linha{flex-wrap:wrap}
  .filtro-linha select{width:100%;min-width:0}
}
.tabela{background:var(--branco);border-radius:14px;overflow:hidden;border:1px solid var(--linha)}
.linha{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #F0F2F5}
.linha:last-child{border-bottom:0}
.linha.inativa{opacity:.5}
.thumb{width:44px;height:52px;flex-shrink:0;border-radius:8px;background:var(--fundo);
  overflow:hidden;padding:3px;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb span{font-size:9.5px;color:#A3ABB6;text-align:center;line-height:1.3}
.info{flex:1;min-width:0}
.info b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.valor{font-size:14.5px;font-weight:700;text-align:right;white-space:nowrap}
.valor small{display:block;font-size:11.5px;font-weight:500;color:var(--cinza)}
.resumo-topo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.cartao-num{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:14px 16px}
.cartao-num small{display:block;font-size:12px;color:#8A94A2;margin-bottom:5px}
.cartao-num b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.cartao-num b.verde{color:var(--verde)}
.cartao-num b.vermelho{color:var(--vermelho)}
.em-breve{background:var(--branco);border-radius:12px;padding:34px 20px;text-align:center;color:var(--cinza)}
.opcao-import{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;
  background:var(--amarelo-fraco);border:1px solid #F1DFB8;border-radius:11px;padding:12px 14px;
  font-size:13.5px;color:#7A6321;cursor:pointer}
.opcao-import input{width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:var(--azul)}
.opcao-import small{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.previa-tabela{background:var(--branco);border:1px solid var(--linha);border-radius:12px;
  padding:4px 0;margin:12px 0;max-height:280px;overflow-y:auto}
.previa-linha{display:flex;gap:10px;padding:9px 14px;font-size:13px;align-items:center;flex-wrap:wrap}
.previa-linha + .previa-linha{border-top:1px solid #F0F2F5}
.marca-tipo{font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;white-space:nowrap}
.t-novo{background:#E4F1FC;color:#0C447C}
.t-alterado{background:#FFF3DC;color:#8A6100}
.t-igual{background:#EFF1F4;color:#77818E}
.t-inativo,.t-erro{background:#FCEBEC;color:#A32D2D}
.previa-linha .depois{margin-left:auto;font-weight:600;white-space:nowrap}
.cab-tabela{display:grid;gap:12px;padding:11px 16px;background:#FAFBFC;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A94A2;
  border-bottom:1px solid var(--linha)}
.produtos-grid{grid-template-columns:56px 1fr 112px 92px 40px}
.colab-grid{grid-template-columns:1fr 152px 104px 92px 40px}
.premio-grid{grid-template-columns:1fr 152px 136px}
.pedidos-grid{grid-template-columns:1fr 104px 104px 104px 116px 40px}
.linha[class*="-grid"]{display:grid;align-items:center;gap:12px}
@media(max-width:760px){
  .cab-tabela{display:none}
  .linha[class*="-grid"]{display:flex;flex-wrap:wrap;gap:9px}
  .linha .info{flex:1 1 100%}
}
.mono{font-size:13.5px;color:var(--cinza);font-variant-numeric:tabular-nums}
.info small{display:block;font-size:12px;color:var(--cinza);margin-top:2px}
.selo-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  border-radius:999px;padding:4px 11px}
.selo-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ativo{background:var(--verde-fraco);color:var(--verde)}
.s-inativo{background:#EFF1F4;color:#8A94A2}
.s-pendente{background:#FFF4E0;color:var(--amarelo)}
.selo-status.clicavel{cursor:pointer;border:1px solid transparent}
.selo-status.clicavel:hover{border-color:currentColor}
.valor.zerado{color:#A3ABB6}
.valor.vermelho{color:var(--vermelho)}

.mini-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--linha);
  background:var(--branco);display:grid;place-items:center;color:#8A94A2;padding:0}
.mini-btn:hover{background:#F4F6F9;color:var(--texto);border-color:#D6DCE4}
.mini-btn svg{width:16px;height:16px;fill:currentColor}

/* ficha lateral */
.ficha{position:fixed;inset:0;z-index:88;background:rgba(20,26,35,.55);display:none;
  align-items:flex-end;justify-content:center;padding:0}
.ficha.aberta{display:flex}
.ficha-caixa{background:var(--branco);width:min(560px,100%);max-height:94vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){
  .ficha{align-items:center;padding:24px}
  .ficha-caixa{border-radius:16px;max-height:88vh}
}
.ficha-topo{display:flex;align-items:center;gap:10px;padding:18px 20px 16px;
  border-bottom:1px solid var(--linha);flex-shrink:0}
.ficha-topo h3{font-size:17px;font-weight:700;flex:1}
.ficha-corpo{flex:1;overflow-y:auto;padding:20px;background:var(--fundo)}
.ficha-pe{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--linha);flex-shrink:0}
.ficha-corpo .campo{margin-bottom:16px}
.ficha-corpo label{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:#8A94A2;margin-bottom:7px}
.ficha-corpo input,.ficha-corpo select,.ficha-corpo textarea{font-size:15px;padding:11px 13px}
.bloco{background:var(--branco);border:1px solid var(--linha);border-radius:12px;
  padding:16px;margin-bottom:16px}
.bloco-titulo{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:#8A94A2;margin-bottom:13px}
.foto-linha{display:flex;gap:16px;align-items:center}
.foto-quadro{width:92px;height:110px;flex-shrink:0;border-radius:10px;background:var(--fundo);
  border:1px solid var(--linha);overflow:hidden;padding:7px;display:grid;place-items:center}
.foto-quadro img{width:100%;height:100%;object-fit:contain;display:block}
.foto-quadro span{font-size:11px;color:#A3ABB6;text-align:center;line-height:1.4}
.foto-acoes{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.dupla{grid-template-columns:1fr;gap:0}}

/* opções em cartão para o status */
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opcao{border:1.5px solid var(--linha);background:var(--branco);border-radius:11px;
  padding:12px 13px;text-align:left;line-height:1.35}
.opcao b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.opcao small{font-size:12px;color:var(--cinza)}
.opcao[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-fraco)}
.opcao[aria-pressed="true"] b{color:var(--azul)}

#seloDemo{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;z-index:80;
  background:rgba(43,52,65,.92);color:#fff;font-size:11.5px;border-radius:999px;padding:6px 14px;
  pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* na área administrativa não existe barra de pedido: desce o selo pro rodapé */
.admin.aberta ~ #seloDemo{bottom:calc(10px + env(safe-area-inset-bottom))}

/* ======================================================================
   AJUSTES DE LAYOUT NO CELULAR
   ====================================================================== */
@media(max-width:860px){
  .lateral-marca{height:46px}
  .lateral-topo{padding:20px 16px 18px}
}

@media(max-width:760px){
  .admin-corpo{padding:14px 12px 46px}
  .admin-barra{padding:10px 12px}
  .admin-barra h1{font-size:16px}
  .admin-quem{font-size:12.5px;white-space:nowrap}

  .admin-cab{gap:8px;margin-bottom:14px}
  .admin-cab h2{font-size:18px;margin-bottom:4px}
  .admin-cab .btn{padding:11px 12px;font-size:13px}

  /* cartões de números: mesma altura, sem sobra */
  .resumo-topo{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
  .cartao-num{padding:11px 13px;min-height:76px;display:flex;flex-direction:column;
    justify-content:space-between;border-radius:13px}
  .cartao-num small{font-size:11.5px;line-height:1.3;margin-bottom:0}
  .cartao-num b{font-size:20px}

  .filtro-linha{gap:8px;margin-bottom:12px}
  .filtro-linha input,.filtro-linha select{padding:11px 12px;font-size:15px}
  .filtro-linha select{padding-right:38px}

  .tabela{border-radius:13px}
  .linha{padding:12px 13px}
  .mini-btn{width:34px;height:34px}
  .selo-status{padding:4px 10px;font-size:11.5px}
  .mono{font-size:13px}
  .valor{font-size:14.5px}

  /* base comum das linhas em grade */
  .linha[class*="-grid"]{display:grid;align-items:center;column-gap:10px;row-gap:7px}
  .linha[class*="-grid"] .info{flex:none}
  .linha[class*="-grid"] .info b{font-size:14.5px}

  /* ---------- PRODUTOS: foto | nome + menu / preço + status ---------- */
  .linha.produtos-grid{grid-template-columns:64px minmax(0,1fr) auto}
  .linha.produtos-grid > :nth-child(1){grid-area:1/1/3/2}
  .linha.produtos-grid > :nth-child(2){grid-area:1/2/2/3}
  .linha.produtos-grid > :nth-child(5){grid-area:1/3/2/4;justify-self:end}
  .linha.produtos-grid > :nth-child(3){grid-area:2/2/3/3;text-align:left}
  .linha.produtos-grid > :nth-child(4){grid-area:2/3/3/4;justify-self:end}
  .linha.produtos-grid .thumb{width:64px;height:76px;border-radius:10px}
  .linha.produtos-grid .valor small{display:inline;margin-left:5px}

  /* ---------- COLABORADORES: nome + menu / CPF / selos ---------- */
  .linha.colab-grid{grid-template-columns:minmax(0,1fr) auto auto}
  .linha.colab-grid > :nth-child(1){grid-area:1/1/2/3}
  .linha.colab-grid > :nth-child(5){grid-area:1/3/2/4;justify-self:end}
  .linha.colab-grid > :nth-child(2){grid-area:2/1/3/4}
  .linha.colab-grid > :nth-child(3){grid-area:3/1/4/2;justify-self:start}
  .linha.colab-grid > :nth-child(4){grid-area:3/2/4/3;justify-self:start}

  /* ---------- PRÊMIO: nome / CPF + valor ---------- */
  .linha.premio-grid{grid-template-columns:minmax(0,1fr) auto}
  .linha.premio-grid > :nth-child(1){grid-area:1/1/2/3}
  .linha.premio-grid > :nth-child(2){grid-area:2/1/3/2}
  .linha.premio-grid > :nth-child(3){grid-area:2/2/3/3}

  /* ---------- PEDIDOS: nome + menu / data + totais / Tiny ---------- */
  .linha.pedidos-grid{grid-template-columns:minmax(0,1fr) auto auto}
  .linha.pedidos-grid > :nth-child(1){grid-area:1/1/2/3}
  .linha.pedidos-grid > :nth-child(6){grid-area:1/3/2/4;justify-self:end}
  .linha.pedidos-grid > :nth-child(2){grid-area:2/1/3/2}
  .linha.pedidos-grid > :nth-child(3){grid-area:2/2/3/3}
  .linha.pedidos-grid > :nth-child(4){grid-area:2/3/3/4}
  .linha.pedidos-grid > :nth-child(5){grid-area:3/1/4/4;justify-self:start}
  .linha.pedidos-grid > :nth-child(3)::before{content:"Total ";font-weight:500;color:var(--cinza)}
  .linha.pedidos-grid > :nth-child(4)::before{content:"A pagar ";font-weight:500;color:var(--cinza)}

  /* prévia de importação mais legível */
  .previa-linha{gap:8px;padding:10px 13px}
  .previa-linha .depois{width:100%;margin-left:0;text-align:right}
}

/* telas bem estreitas */
@media(max-width:360px){
  .resumo-topo{grid-template-columns:1fr}
  .cartao-num{min-height:0;flex-direction:row;align-items:center;justify-content:space-between}
  .cartao-num b{font-size:19px}
  .linha.produtos-grid{grid-template-columns:56px minmax(0,1fr) auto}
  .linha.produtos-grid .thumb{width:56px;height:68px}
}

<div class="entrada aberta" id="entrada">
  <div class="entrada-int">
    <img class="marca" src="" data-logo alt="Atrius">

    <p class="sub-t" id="entradaCompetencia"></p>
    <div id="erroEntrada"></div>
    <div id="entradaCorpo"></div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="barra">
      <img class="marca" src="" data-logo alt="Atrius">
      <div class="saudacao" id="ola"></div>
      <div class="programa" id="programa"></div>
      <button class="sair-topo" id="btnMeus" onclick="abrir('meus')">Meus pedidos</button>
      <button class="sair-topo" id="btnAdmin" onclick="abrirAdmin()" hidden>Administração</button>
      <button class="sair-topo" onclick="sair()">Sair</button>
    </div>
  </div>
</header>

<div class="wrap">

    <input id="busca" type="search" placeholder="Buscar produto" oninput="desenhar()" aria-label="Buscar produto">
  </div>
  <div class="abas" id="abas"></div>
</div>

<main class="wrap" id="conteudo"></main>

<div class="barra-pedido" id="barraPedido">
  <div class="pedido-int">
    <div class="trilho"><i id="barra" style="width:0%"></i></div>
    <div class="saldo-linha" id="saldoLinha">
      <span id="saldoNormal">Pedido <b id="usado">R$ 0,00</b> de <b id="limite">R$ 0,00</b></span>
      <span id="saldoZero" hidden>
        <span class="selo-sem">Sem prêmio este mês</span>
      </span>
      <span class="direita" id="restante"></span>
    </div>
    <div class="aviso-pagar" id="avisoPagar" hidden></div>
    <div class="pedido-baixo">
      <div class="resumo" id="resumoRodape">
        <small id="contagem">0 itens</small>
        <strong id="totalRodape">R$ 0,00</strong>
      </div>
      <button class="ver" id="btnVer" onclick="abrir('carrinho')" disabled>Ver pedido</button>
    </div>
  </div>
</div>

<div class="fundo-modal" id="fundoModal" onclick="fecharTudo()"></div>

<aside class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="tituloPainel">
  <div class="painel-topo">
    <h2 id="tituloPainel">Seu pedido</h2>
    <button class="fechar" onclick="fecharTudo()" aria-label="Fechar">&times;</button>
  </div>
  <div class="painel-corpo" id="painelCorpo"></div>
  <div class="painel-pe" id="painelPe"></div>
</aside>

<div class="admin" id="admin">
  <div class="lateral-fundo" id="lateralFundo" onclick="fecharLateral()"></div>

  <nav class="lateral" id="lateral">
    <div class="lateral-topo">
      <img src="" data-logo alt="Atrius" class="lateral-marca">
      <button class="lateral-recolher" onclick="recolherLateral()" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="lateral-itens" id="lateralItens"></div>
    <div class="lateral-pe">
      <button class="lateral-item" onclick="verComoColaborador()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Ver como colaborador</span></button>
      <button class="lateral-item" onclick="sair()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Sair</span></button>
    </div>
  </nav>

  <div class="admin-lado">
    <div class="admin-barra">
      <button class="hamburguer" onclick="abrirLateral()" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="adminTituloTopo">Administração</h1>
      <span class="admin-quem" id="adminOla"></span>
    </div>
    <div class="admin-corpo"><div class="admin-int" id="adminCorpo"></div></div>
  </div>
</div>

<div class="ficha" id="ficha" role="dialog" aria-modal="true">
  <div class="ficha-caixa">
    <div class="ficha-topo"><h3 id="fichaTitulo"></h3>
      <button class="fechar" onclick="fecharFicha()" aria-label="Fechar">&times;</button></div>
    <div class="ficha-corpo" id="fichaCorpo"></div>
    <div class="ficha-pe" id="fichaPe"></div>
  </div>
</div>

<input type="file" id="arqImport" accept=".xlsx,.xls" hidden onchange="lerPlanilha(this)">
<input type="file" id="arqFoto" accept="image/*" hidden onchange="trocarFoto(this)">

<div class="visor" id="visor" role="dialog" aria-modal="true">

  <div class="visor-img" id="visorImg" onclick="fecharVisor()"></div>

</div>

const PRODUTOS = [];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho',
               'julho','agosto','setembro','outubro','novembro','dezembro'];

/* A competência é sempre o mês corrente. O banco usa a mesma regra ao gravar
   o pedido, então as duas pontas nunca discordam. */
const COMPETENCIA = (() => {
  const [d, m, a] = new Intl.DateTimeFormat('pt-BR', {timeZone:'America/Sao_Paulo'})
    .format(new Date()).split('/').map(Number);
  return {mes: m, ano: a, rotulo: `${MESES[m-1].toUpperCase()} ${a}`};
})();
const MIN_SENHA = 6;
const PAGAMENTOS = ['Dinheiro','Pix','Cartão de crédito','Cartão de débito'];

const COLABORADORES = [];
const PEDIDOS = [];

const estado = {carrinho:{}, linha:'todas', etapa:'carrinho', colaborador:null,
                ampliado:null, obs:'', pedido:null,
                entrada:{passo:'cpf', cpf:'', nome:''}, pagamento:null, vendo:null};

const brl = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const el = id => document.getElementById(id);
const esc = t => String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digitos = t => String(t||'').replace(/\D/g,'');
const formatarCpf = c => {
  const d = digitos(c);
  return d.length === 11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : String(c||'');
};
const SEM_FOTO = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>';

sb.auth.getSession().then(({data}) => { if(data.session) iniciarSessao(); });
document.querySelectorAll('[data-logo]').forEach(i => i.src = LOGO);
el('entradaCompetencia').textContent = 'Competência ' + COMPETENCIA.rotulo.toLowerCase();
pintarEntrada();

function mascaraCpf(campo){
  const d = digitos(campo.value).slice(0,11);
  let saida = d;
  if(d.length > 9)      saida = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  else if(d.length > 6) saida = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  else if(d.length > 3) saida = `${d.slice(0,3)}.${d.slice(3)}`;
  campo.value = saida;
  if(estado.entrada) estado.entrada.cpf = d;
}

function verSenha(id){
  const c = el(id);
  c.type = c.type === 'password' ? 'text' : 'password';
}

function campoSenha(id, rotulo, acao, dica){
  return `<div class="campo"><label for="${id}">${rotulo}</label>
    <div class="senha-campo">
      <input id="${id}" type="password" placeholder="${dica||''}"
             autocomplete="${acao==='entrar'?'current-password':'new-password'}"
             onkeydown="if(event.key==='Enter')${acao}()">
      <button type="button" class="olho" onclick="verSenha('${id}')" aria-label="Mostrar senha">&#128065;</button>
    </div></div>`;
}

function pintarEntrada(){
  const e = estado.entrada;
  const corpo = el('entradaCorpo');

  if(e.passo === 'cpf'){
    corpo.innerHTML = `
      <div class="campo"><label for="cpf">CPF</label>
        <input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"
               autocomplete="username" value="${e.cpf?formatarCpf(e.cpf):''}"
               oninput="mascaraCpf(this)" onkeydown="if(event.key==='Enter')conferirCpf()"></div>
      <button class="principal" id="btnCpf" onclick="conferirCpf()">Continuar</button>
      <p class="nota" style="text-align:center">Use seu CPF para acessar.</p>`;
    setTimeout(()=>el('cpf') && el('cpf').focus(), 60);
  }

  if(e.passo === 'senha'){
    corpo.innerHTML = `
      <p class="quem">${esc(e.nome)}</p>
      ${campoSenha('senha','Senha','entrar','Sua senha de acesso')}
      <button class="principal" id="btnEntrar" onclick="entrar()">Entrar</button>
      <button class="secundario" onclick="voltarCpf()">Não sou eu</button>`;
    setTimeout(()=>el('senha') && el('senha').focus(), 60);
  }

  if(e.passo === 'criar'){
    corpo.innerHTML = `
      <p class="quem">${esc(e.nome)}</p>
      <div class="quadro" style="background:var(--azul-fraco);margin-bottom:16px">
        <b style="display:block;font-size:14px;margin-bottom:3px">Primeiro acesso</b>
        <span style="font-size:13px;color:var(--cinza);line-height:1.5">
        Crie uma senha só sua. Ela protege seu saldo e seus pedidos.</span>
      </div>
      ${campoSenha('nova','Nova senha','criarSenha', `Pelo menos ${MIN_SENHA} caracteres`)}
      ${campoSenha('confirma','Repita a senha','criarSenha','Digite de novo')}
      <button class="principal" id="btnCriar" onclick="criarSenha()">Criar senha e entrar</button>
      <button class="secundario" onclick="voltarCpf()">Voltar</button>`;
    setTimeout(()=>el('nova') && el('nova').focus(), 60);
  }
}

function erroEntrada(m){ el('erroEntrada').innerHTML = m ? `<div class="aviso">${esc(m)}</div>` : ''; }
function voltarCpf(){ estado.entrada = {passo:'cpf', cpf:estado.entrada.cpf, nome:''}; erroEntrada(''); pintarEntrada(); }

/* ------------------------------------------------------- dados do Supabase */

async function carregarDados(){
  const [pr, co, sa] = await Promise.all([
    sb.from('produtos').select('*').order('ordem'),
    sb.from('colaboradores').select('*').order('nome'),
    sb.from('saldos').select('*'),
  ]);
  if(pr.error) throw pr.error;

  PRODUTOS.length = 0;
  (pr.data || []).forEach(p => PRODUTOS.push({
    ...p, ativo: p.ativo ? 1 : 0, foto: urlFoto(p.foto_url)
  }));

  COLABORADORES.length = 0;
  (co.data || []).forEach(c => COLABORADORES.push({
    ...c, ativo: c.ativo ? 1 : 0, saldo: 0, saldos: {}, tem_senha: false
  }));

  (sa.data || []).forEach(s => {
    const c = COLABORADORES.find(x => x.cpf === s.cpf);
    if(!c) return;
    c.saldos[s.competencia] = s.valor;
    if(s.competencia === compAtual()) c.saldo = s.valor;
  });

  const {data: comSenha} = await sb.rpc('cpfs_com_senha');
  (comSenha || []).forEach(cpf => {
    const c = COLABORADORES.find(x => x.cpf === cpf);
    if(c) c.tem_senha = true;
  });

  await carregarPedidos();
}

async function carregarPedidos(){
  const {data} = await sb.from('pedidos')
    .select('*, pedido_itens(*)').order('criado_em', {ascending:false});
  PEDIDOS.length = 0;
  (data || []).forEach(p => PEDIDOS.push({
    codigo: p.codigo, cpf: p.cpf,
    nome: (COLABORADORES.find(c => c.cpf === p.cpf) || {}).nome || p.cpf,
    competencia: p.competencia,
    data: new Date(p.criado_em).toLocaleDateString('pt-BR'),
    saldo: p.saldo, total: p.total, excedente: p.excedente,
    pagamento: p.pagamento, obs: p.obs, tiny: p.tiny, tiny_erro: p.tiny_erro,
    itens: (p.pedido_itens || []).map(i => ({
      sku: i.sku, nome: i.nome, quantidade: i.quantidade, preco: i.preco
    })),
  }));
}

async function iniciarSessao(){
  const u = (await sb.auth.getUser()).data.user;
  if(!u) return;
  const cpf = digitos(u.email.split('@')[0]);
  try{ await carregarDados(); }
  catch(e){ return erroEntrada('Não foi possível carregar os dados.'); }
  const conta = COLABORADORES.find(c => c.cpf === cpf && c.ativo);
  if(!conta){
    await sb.auth.signOut();
    return erroEntrada('Cadastro não encontrado ou inativo. Procure o RH.');
  }
  aposEntrar(conta);
}

async function conferirCpf(){
  const cpf = digitos(el('cpf').value);
  erroEntrada('');
  if(cpf.length !== 11) return erroEntrada('CPF incompleto.');
  const b = el('btnCpf'); b.disabled = true; b.textContent = 'Verificando...';

  const {data, error} = await sb.rpc('checar_cpf', {p_cpf: cpf});
  b.disabled = false; b.textContent = 'Continuar';

  if(error){
    console.error('checar_cpf', error);
    return erroEntrada('Erro: ' + (error.message || error.hint || JSON.stringify(error)));
  }
  if(!data.existe) return erroEntrada('CPF não encontrado. Procure o RH.');
  if(!data.ativo)  return erroEntrada('Seu acesso está inativo. Procure o RH.');

  estado.entrada = {passo: data.tem_senha ? 'senha' : 'criar', cpf, nome: data.nome};
  pintarEntrada();
}

async function entrar(){
  const b = el('btnEntrar'); b.disabled = true; b.textContent = 'Entrando...';
  erroEntrada('');
  const {error} = await sb.auth.signInWithPassword({
    email: emailDe(estado.entrada.cpf), password: el('senha').value});
  if(error){
    b.disabled = false; b.textContent = 'Entrar';
    return erroEntrada('Senha incorreta.');
  }
  await iniciarSessao();
}

async function criarSenha(){
  const b = el('btnCriar');
  const nova = el('nova').value, confirma = el('confirma').value;
  erroEntrada('');
  if(nova.length < MIN_SENHA)
    return erroEntrada(`A senha precisa de ao menos ${MIN_SENHA} caracteres.`);
  if(nova !== confirma) return erroEntrada('As senhas não conferem.');

  b.disabled = true; b.textContent = 'Criando...';
  const email = emailDe(estado.entrada.cpf);
  const {error} = await sb.auth.signUp({email, password: nova});
  if(error){
    b.disabled = false; b.textContent = 'Criar senha e entrar';
    return erroEntrada('Não foi possível criar a senha: ' + error.message);
  }
  if(!(await sb.auth.getSession()).data.session)
    await sb.auth.signInWithPassword({email, password: nova});
  await iniciarSessao();
}

function aposEntrar(conta){
  estado.colaborador = conta;
  if(conta.admin){
    el('entrada').classList.remove('aberta');
    el('adminOla').textContent = primeiroNome(conta.nome);
    abrirAdmin();
  }
  el('entrada').classList.remove('aberta');
  el('ola').innerHTML = conta.saldo > 0
    ? `Olá, <b>${esc(primeiroNome(conta.nome))}</b>, esse mês você tem
       <span class="valor">${brl(conta.saldo)}</span>`
    : `Olá, <b>${esc(primeiroNome(conta.nome))}</b>, você não tem prêmio este mês`;
  el('btnAdmin').hidden = !conta.admin;

  el('programa').textContent = 'Prêmio Cesta de Limpeza · ' + COMPETENCIA.rotulo;
  abas(); desenhar(); atualizarSaldo();
}

function primeiroNome(n){
  const p = String(n||'').trim().split(' ');
  return p[0].charAt(0) + p[0].slice(1).toLowerCase();
}

async function sair(){
  await sb.auth.signOut();
  fecharAdmin();
  estado.colaborador = null; estado.carrinho = {}; estado.obs = '';
  estado.entrada = {passo:'cpf', cpf:'', nome:''};
  erroEntrada(''); pintarEntrada();
  fecharTudo(); atualizarSaldo();
  el('entrada').classList.add('aberta');
}

function abas(){
  const ordem = ['CASA','ROUPAS','COZINHA'];
  const ativos = PRODUTOS.filter(p => p.ativo);
  const tem = new Set(ativos.map(p=>p.linha));
  const linhas = ['todas', ...ordem.filter(l=>tem.has(l))];
  el('abas').innerHTML = linhas.map(l=>{
    const n = l==='todas' ? ativos.length : ativos.filter(p=>p.linha===l).length;
    return `<button class="aba" aria-pressed="${estado.linha===l}" onclick="filtrar('${esc(l)}')">${
      l==='todas'?'Tudo':esc(l)}<em>${n}</em></button>`;
  }).join('');
}

function filtrar(l){ estado.linha = l; abas(); desenhar(); window.scrollTo({top:0,behavior:'smooth'}); }

function cartao(p){
  const qtd = estado.carrinho[p.sku]?.quantidade || 0;
  return `
  <article class="item">
    ${p.foto
      ? `<button class="foto" onclick="ampliar('${esc(p.sku)}')" aria-label="Ver foto de ${esc(p.nome)}">
           <img src="${p.foto}" alt="" loading="lazy" decoding="async">
           <span class="lupa"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg></span>
         </button>`
      : `<div class="foto">${SEM_FOTO}</div>`}
    <div class="dados">
      <h3>${esc(p.nome)}</h3>
      <div class="cod">${esc(p.sku)}</div>
      <div class="rodape-item">
        <div class="preco">${brl(p.preco)}<small>por unidade</small></div>
        <div class="acao">${qtd
          ? `<div class="stepper">
               <button onclick="mudar('${esc(p.sku)}',-1)" aria-label="Diminuir">&minus;</button>
               <b>${qtd}</b>
               <button onclick="mudar('${esc(p.sku)}',1)" aria-label="Aumentar">+</button>
             </div>`
          : `<button class="mais-btn" onclick="mudar('${esc(p.sku)}',1)" aria-label="Adicionar ${esc(p.nome)}">+</button>`}
        </div>
      </div>
    </div>
  </article>`;
}

function desenhar(){
  const termo = (el('busca').value||'').trim().toLowerCase();
  const lista = PRODUTOS.filter(p => p.ativo &&
    (estado.linha==='todas' || p.linha===estado.linha) &&
    (!termo || (p.nome+' '+p.sku).toLowerCase().includes(termo)));

  if(!lista.length){
    el('conteudo').innerHTML = '<p class="vazio">Nenhum produto encontrado.</p>';
    return;
  }
  if(estado.linha === 'todas' && !termo){
    const ordem = ['CASA','ROUPAS','COZINHA'];
    el('conteudo').innerHTML = ordem.filter(g => lista.some(p=>p.linha===g)).map(g=>`
      <section class="grupo"><h2>${esc(g)}</h2></section>
      <div class="lista">${lista.filter(p=>p.linha===g).map(cartao).join('')}</div>`).join('');
  }else{
    el('conteudo').innerHTML = `<div class="lista" style="padding-top:14px">${lista.map(cartao).join('')}</div>`;
  }
}

function mudar(sku, delta){
  const p = PRODUTOS.find(x=>x.sku===sku);
  if(!p || !p.ativo) return;
  const atual = estado.carrinho[sku]?.quantidade || 0;
  const novo = Math.min(99, Math.max(0, atual+delta));
  if(novo === 0) delete estado.carrinho[sku];
  else estado.carrinho[sku] = {...p, quantidade:novo};
  atualizarSaldo(); desenhar();
  if(estado.ampliado) pintarVisor();
  if(el('painel').classList.contains('aberto')) pintar();
}

const total = () => Object.values(estado.carrinho).reduce((s,i)=>s+i.preco*i.quantidade,0);
const contar = () => Object.values(estado.carrinho).reduce((s,i)=>s+i.quantidade,0);

function calcular(){
  const t = total();
  const limite = estado.colaborador ? estado.colaborador.saldo : 0;
  const usado = Math.min(t, limite);
  return {total:t, limite, usado, sobra: Math.max(0, limite-t), excedente: Math.max(0, t-limite)};
}

function atualizarSaldo(){
  const c = calcular(), n = contar();
  const semSaldo = c.limite === 0;

  el('barraPedido').classList.toggle('sem-saldo', semSaldo);
  el('saldoNormal').hidden = semSaldo;
  el('saldoZero').hidden = !semSaldo || c.total > 0;
  el('saldoLinha').hidden = semSaldo && c.total > 0;

  el('usado').textContent = brl(c.total);
  el('limite').textContent = brl(c.limite);
  el('barra').style.width = (c.limite ? Math.min(100, c.total/c.limite*100) : (c.total?100:0)) + '%';

  el('restante').textContent = semSaldo ? ''
    : (c.excedente > 0 ? 'Passou ' + brl(c.excedente) : 'Ainda tem ' + brl(c.sobra));

  const aviso = el('avisoPagar');
  aviso.hidden = c.excedente === 0;
  if(c.excedente > 0)
    aviso.innerHTML = semSaldo
      ? `Sem prêmio este mês: você pagará <b>${brl(c.total)}</b> por este pedido.`
      : `Você pagará apenas a diferença de <b>${brl(c.excedente)}</b> por este pedido.`;

  el('contagem').textContent = n === 1 ? '1 item' : n + ' itens';
  el('totalRodape').textContent = brl(c.total);
  el('resumoRodape').classList.toggle('estourou', c.excedente > 0);
  el('barraPedido').classList.toggle('estourou', c.excedente > 0);
  el('btnVer').disabled = n === 0;
}

function ampliar(sku){
  const p = PRODUTOS.find(x=>x.sku===sku);
  if(!p || !p.foto) return;
  estado.ampliado = sku;
  el('visorImg').innerHTML = `<img src="${p.foto}" alt="${esc(p.nome)}">`;
  pintarVisor();
  el('visor').classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

function pintarVisor(){
  const p = PRODUTOS.find(x=>x.sku===estado.ampliado);
  if(!p) return;
  const qtd = estado.carrinho[p.sku]?.quantidade || 0;
  el('visorPe').innerHTML = `
    <h3>${esc(p.nome)}</h3>
    <div class="cod">${esc(p.sku)}</div>
    <div class="visor-linha">
      <div class="preco">${brl(p.preco)}<small>por unidade</small></div>
      <div class="acao">${qtd
        ? `<div class="stepper">
             <button onclick="mudar('${esc(p.sku)}',-1)" aria-label="Diminuir">&minus;</button>
             <b>${qtd}</b>
             <button onclick="mudar('${esc(p.sku)}',1)" aria-label="Aumentar">+</button>
           </div>`
        : `<button class="mais-btn" onclick="mudar('${esc(p.sku)}',1)">Adicionar</button>`}
      </div>
    </div>`;
}

function fecharVisor(){
  estado.ampliado = null;
  el('visor').classList.remove('aberto');
  document.body.style.overflow = '';
}

/* ------------------------------------------------- botão voltar do navegador
   Cada camada aberta (aba da administração, painel, ficha, gaveta) vira uma
   entrada no histórico. O voltar fecha a camada de cima em vez de sair do site.
   Só sai quando não há mais nada aberto. */

let historicoPronto = false;

function marcarHistorico(){
  history.pushState({app: true}, '');
  historicoPronto = true;
}

function aberto(id, classe){
  const n = el(id);
  return n && n.classList.contains(classe);
}

/* Fecha a camada mais externa. Devolve false quando não há nada a fechar. */
function voltarUmNivel(){
  if(aberto('ficha', 'aberta')){ fecharFicha(); return true; }
  if(aberto('painel', 'aberto')){ fecharTudo(); return true; }
  if(aberto('admin', 'menu-aberto')){ fecharLateral(); return true; }
  if(aberto('admin', 'aberta')){
    if(admin.previa){ admin.previa = null; admin.importando = null; pintarAdmin(); return true; }
    if(admin.aba !== 'produtos'){ irAba('produtos'); return true; }
    fecharAdmin(); return true;
  }
  return false;
}

addEventListener('popstate', () => {
  if(voltarUmNivel()) marcarHistorico();
  else historicoPronto = false;
});

function abrir(etapa){
  if(!aberto('painel','aberto')) marcarHistorico();
  estado.etapa = etapa;
  el('fundoModal').classList.add('aberto');
  el('painel').classList.add('aberto');
  pintar();
}

function fecharTudo(){
  el('fundoModal').classList.remove('aberto');
  el('painel').classList.remove('aberto');
}

function observacaoTiny(){
  const c = calcular();
  const linhas = ['PREMIO CESTA DE LIMPEZA - ' + COMPETENCIA.rotulo];
  linhas.push(c.excedente > 0
    ? `Saldo ${brl(c.limite)} | Usado ${brl(c.usado)} | A PAGAR ${brl(c.excedente)}`
    : `Saldo ${brl(c.limite)} | Usado ${brl(c.total)} | Sobrou ${brl(c.sobra)}`);
  if(c.excedente > 0 && estado.pagamento)
    linhas.push('Pagamento da diferença: ' + estado.pagamento);
  if(estado.obs.trim()) linhas.push('Obs.: ' + estado.obs.trim());
  return linhas.join('\n');
}

function pintar(){
  const corpo = el('painelCorpo'), pe = el('painelPe');
  el('tituloPainel').textContent = {carrinho:'Seu pedido', fechar:'Fechar pedido',
    pronto:'Pedido enviado', meus:'Meus pedidos', detalhe:'Detalhe do pedido'}[estado.etapa] || '';
  const c = calcular();

  if(estado.etapa === 'carrinho'){
    const itens = Object.values(estado.carrinho);
    corpo.innerHTML = itens.length ? itens.map(i=>`
      <div class="carrinho-item">
        <div class="mini">${i.foto?`<img src="${i.foto}" alt="">`:''}</div>
        <div>
          <h4>${esc(i.nome)}</h4>
          <div class="meta">${i.quantidade} un &times; ${brl(i.preco)}</div>
          <button class="remover" onclick="mudar('${esc(i.sku)}',-${i.quantidade})">remover</button>
        </div>
        <div class="val">${brl(i.preco*i.quantidade)}</div>
      </div>`).join('') : '<p class="vazio">Nenhum item ainda.</p>';
    pe.innerHTML = `
      <div class="total ${c.excedente?'estourou':''}"><span>Total</span><strong>${brl(c.total)}</strong></div>
      <button class="principal" style="margin-top:12px" ${itens.length?'':'disabled'}
              onclick="abrir('fechar')">Continuar</button>`;
  }

  if(estado.etapa === 'fechar'){
    corpo.innerHTML = `
      <div id="erro"></div>
      <div class="quadro ${c.excedente?'alerta':''}">
        <div class="sub">Saldo do prêmio <span>${brl(c.limite)}</span></div>
        <div class="sub">Total do pedido <span>${brl(c.total)}</span></div>
        <div class="total ${c.excedente?'estourou':''}" style="font-size:14px">
          <span>${c.excedente ? 'Saldo a pagar' : 'Sobra do saldo'}</span>
          <strong style="font-size:19px">${brl(c.excedente || c.sobra)}</strong>
        </div>
      </div>
      ${c.excedente ? `
      <div class="campo">
        <label>Como você quer pagar ${c.limite ? 'a diferença' : 'este pedido'}?</label>
        <div class="pagamentos">
          ${PAGAMENTOS.map(f => `
            <button class="forma" data-forma="${esc(f)}" aria-pressed="${estado.pagamento===f}"
                    onclick="escolherPagamento(this.dataset.forma)">${esc(f)}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="campo"><label for="obs">Tem alguma observação a acrescentar?</label>
        <textarea id="obs" placeholder="Recado para a separação" oninput="estado.obs=this.value">${esc(estado.obs)}</textarea></div>`;
    pe.innerHTML = `
      <button class="principal" id="btnEnviar" onclick="enviar()">Enviar pedido</button>
      <button class="secundario" onclick="abrir('carrinho')">Voltar ao pedido</button>`;
  }

  if(estado.etapa === 'meus'){
    const cpf = estado.colaborador.cpf;
    const meus = PEDIDOS.filter(x => x.cpf === cpf)
      .sort((a,b) => b.competencia.localeCompare(a.competencia));
    const porMes = {};
    meus.forEach(x => (porMes[x.competencia] = porMes[x.competencia] || []).push(x));

    corpo.innerHTML = Object.keys(porMes).length
      ? Object.keys(porMes).sort().reverse().map(comp => {
          const lista = porMes[comp];
          const saldo = lista[0].saldo;
          const usado = lista.reduce((s,x) => s + Math.min(x.total, x.saldo), 0);
          const pagar = lista.reduce((s,x) => s + (x.excedente||0), 0);
          return `
          <div class="grupo-mes">
            <h3>${rotuloComp(comp)}</h3>
            <div class="quadro">
              <div class="sub">Prêmio do mês <span>${brl(saldo)}</span></div>
              <div class="sub">Usado <span>${brl(usado)}</span></div>
              ${pagar ? `<div class="sub" style="color:var(--vermelho)">
                Saldo pago <span>${brl(pagar)}</span></div>` : ''}
            </div>
            ${lista.map(x => `
              <button class="hist" onclick="verMeuPedido('${esc(x.codigo)}')">
                <div><b>${esc(x.data)}</b>
                  <small>${x.itens.length} ${x.itens.length===1?'item':'itens'} ·
                  ${x.tiny ? 'em separação' : 'aguardando'}</small></div>
                <span class="valor">${brl(x.total)}</span>
              </button>`).join('')}
          </div>`;
        }).join('')
      : '<p class="vazio">Você ainda não fez pedidos.</p>';
    pe.innerHTML = `<button class="principal" onclick="fecharTudo()">Voltar ao catálogo</button>`;
  }

  if(estado.etapa === 'detalhe'){
    const x = estado.vendo;
    corpo.innerHTML = !x ? '' : `
      <div class="quadro">
        <div class="sub">Data <span>${esc(x.data)}</span></div>
        <div class="sub">Prêmio do mês <span>${brl(x.saldo)}</span></div>
        <div class="sub">Total do pedido <span>${brl(x.total)}</span></div>
        ${x.excedente ? `<div class="sub" style="color:var(--vermelho)">
          Saldo pago <span>${brl(x.excedente)} · ${esc(x.pagamento||'')}</span></div>` : ''}
      </div>
      ${x.itens.map(i => `
        <div class="carrinho-item">
          <div class="mini">${fotoDe(i.sku)}</div>
          <div><h4>${esc(i.nome)}</h4><div class="meta">${i.quantidade} un × ${brl(i.preco)}</div></div>
          <div class="val">${brl(i.quantidade*i.preco)}</div>
        </div>`).join('')}`;
    pe.innerHTML = `<button class="principal" onclick="repetirPedido()">Repetir este pedido</button>
      <button class="secundario" onclick="abrir('meus')">Voltar</button>`;
  }

  if(estado.etapa === 'pronto'){
    const p = estado.pedido || {};
    corpo.innerHTML = `
      <div class="ok">
        <div class="selo">&check;</div>
        <h2>Pedido enviado</h2>
        <p class="nota">${p.numero
          ? 'Pedido <strong>'+esc(p.numero)+'</strong> registrado.'
          : 'Seu pedido foi registrado.'}<br>
        A separação vai preparar e avisar quando estiver pronto.</p>
      </div>
      ${p.excedente ? `<div class="quadro alerta" style="text-align:center">
        Saldo a pagar deste pedido: <b>${brl(p.excedente)}</b>${
          p.pagamento ? ' · ' + esc(p.pagamento) : ''}</div>` : ''}`;
    pe.innerHTML = `<button class="principal" onclick="recomecar()">Voltar ao início</button>`;
  }
}

function escolherPagamento(f){
  estado.pagamento = f;
  document.querySelectorAll('.forma').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.forma === f)));
  const erro = el('erro');
  if(erro) erro.innerHTML = '';
}

async function enviar(){
  const c = calcular();
  if(c.excedente > 0 && !estado.pagamento){
    el('erro').innerHTML = `<div class="aviso">Escolha como quer pagar ${
      c.limite ? 'a diferença' : 'este pedido'}.</div>`;
    return;
  }
  const b = el('btnEnviar'); b.disabled = true; b.textContent = 'Enviando...';

  const {data, error} = await sb.rpc('criar_pedido', {
    p_itens: Object.values(estado.carrinho)
               .map(i => ({sku: i.sku, quantidade: i.quantidade})),
    p_obs: estado.obs.trim() || null,
    p_pagamento: c.excedente > 0 ? estado.pagamento : null,
  });

  if(error){
    b.disabled = false; b.textContent = 'Enviar pedido';
    el('erro').innerHTML = `<div class="aviso">${esc(error.message)}</div>`;
    return;
  }

  estado.pedido = {numero: data, excedente: c.excedente, pagamento: estado.pagamento};
  estado.carrinho = {}; estado.obs = ''; estado.pagamento = null;
  await enviarAoTiny(data);   // se falhar, fica pendente para o admin reenviar
  await carregarPedidos();
  atualizarSaldo(); desenhar(); abrir('pronto');
}

function fotoDe(sku){
  const p = PRODUTOS.find(x => x.sku === sku);
  return p && p.foto ? `<img src="${p.foto}" alt="">` : '';
}

function verMeuPedido(codigo){
  estado.vendo = PEDIDOS.find(x => x.codigo === codigo);
  abrir('detalhe');
}

function repetirPedido(){
  const x = estado.vendo;
  if(!x) return;
  let fora = [];
  estado.carrinho = {};
  x.itens.forEach(i => {
    const p = PRODUTOS.find(y => y.sku === i.sku);
    if(p && p.ativo) estado.carrinho[p.sku] = {...p, quantidade:i.quantidade};
    else fora.push(i.nome);
  });
  atualizarSaldo(); desenhar(); abrir('carrinho');
  if(fora.length) setTimeout(() => alert(
    'Estes itens não estão disponíveis e ficaram de fora:\n\n' + fora.join('\n')), 250);
}

function repintar(desenhar){
  const alvo = document.activeElement;
  const id = alvo && alvo.id;
  const pos = alvo && alvo.selectionStart;
  desenhar();
  if(!id) return;
  const novo = el(id);

  novo.focus();
  try{ novo.setSelectionRange(pos, pos); }catch(e){}
}

async function gravarProduto(p){

async function subirFoto(sku, dataUrl){
  const m = String(dataUrl).match(/^data:image\/([a-z]+);base64,(.+)$/);
  if(!m) return null;
  const bin = atob(m[2]);
  const buf = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const nome = `${sku}.${m[1]}`;
  const {error} = await sb.storage.from('produtos')
    .upload(nome, buf, {contentType: `image/${m[1]}`, upsert: true});
  if(error){ avisarErro(error); return null; }
  return nome;
}

  el(campo).parentElement.querySelectorAll(`[data-campo="${campo}"]`).forEach(b =>

  admin.fotoNova = '';
  el('fichaFoto').innerHTML = '<span>sem foto</span>';
  const b = el('btnTirarFoto'); if(b) b.hidden = true;
}

function trocarFoto(input){
  const arq = input.files && input.files[0];
  input.value = '';
  if(!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    admin.fotoNova = leitor.result;
    el('fichaFoto').innerHTML = `<img src="${leitor.result}" alt="">`;
    const b = el('btnTirarFoto'); if(b) b.hidden = false;
  };
  leitor.readAsDataURL(arq);
}

async function salvarProduto(){
  const p = PRODUTOS.find(x => x.sku === admin.editando.sku);
  if(!p) return;
  const preco = Math.round(parseFloat(el('fPreco').value.replace(/\./g,'').replace(',','.')) * 100);
  if(!isFinite(preco) || preco <= 0) return erroFicha('Preço inválido.');
  const sku = el('fSku').value.trim();
  if(!sku) return erroFicha('Informe o código.');
  if(sku !== p.sku && PRODUTOS.some(x => x.sku === sku))
    return erroFicha('Já existe produto com este código.');

  const antigo = p.sku;
  p.nome  = el('fNome').value.trim() || p.nome;
  p.sku   = sku;
  p.preco = preco;
  p.linha = el('fLinha').value;

  if(admin.fotoNova !== null){
    if(admin.fotoNova === ''){ p.foto_url = null; p.foto = ''; }
    else {
      const nome = await subirFoto(sku, admin.fotoNova);
      if(nome){ p.foto_url = nome; p.foto = urlFoto(nome) + '?v=' + Date.now(); }
    }
  }
  if(!p.ativo && estado.carrinho[p.sku]) delete estado.carrinho[p.sku];

  await gravarProduto(p);
  if(antigo !== sku) await sb.from('produtos').delete().eq('sku', antigo);

  fecharFicha(); telaProdutos();
}

async function zerarSenha(cpf){
  const c = COLABORADORES.find(x => x.cpf === cpf);
  if(!c) return;
  if(!confirm(`Zerar a senha de ${c.nome}?\n\n`
            + 'Ela será apagada e a pessoa cria uma nova no próximo acesso, '
            + 'digitando o CPF.')) return;
  const {error} = await sb.rpc('zerar_senha', {p_cpf: cpf});
  if(error) return avisarErro(error);
  c.tem_senha = false;
  fecharFicha(); telaColaboradores();
}

async function salvarColaborador(){
  const nome = el('cNome').value.trim();
  const cpf = digitos(el('cCpf').value);
  if(nome.split(' ').filter(Boolean).length < 2) return erroFicha('Informe nome e sobrenome.');
  if(cpf.length !== 11) return erroFicha('CPF incompleto.');

  const antigo = admin.editando.cpf;
  if(cpf !== antigo && COLABORADORES.some(x => x.cpf === cpf))
    return erroFicha('Já existe cadastro com este CPF.');

  let c = COLABORADORES.find(x => x.cpf === antigo);
  if(!c){ c = {cpf, nome, saldo:0, saldos:{}, ativo:1, tem_senha:false, admin:false}; COLABORADORES.push(c); }
  c.nome = nome; c.cpf = cpf;
  if(!admin.editando.cpf) c.ativo = 1;
  c.admin = el('cPerfil').value === 'admin';

  await gravarColaborador(c);
  if(antigo && antigo !== cpf) await sb.from('colaboradores').delete().eq('cpf', antigo);

  COLABORADORES.sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  fecharFicha(); telaColaboradores();
}

function saldoDe(c, comp){
  if(c.saldos && c.saldos[comp] !== undefined) return c.saldos[comp];
  return comp === `${COMPETENCIA.ano}-${String(COMPETENCIA.mes).padStart(2,'0')}` ? (c.saldo||0) : 0;
}

async function enviarAoTiny(codigo){
  const {data, error} = await sb.functions.invoke('enviar-tiny', {body:{codigo}});
  if(error){
    let msg = null;
    try{ msg = (await error.context.json()).erro; }catch(e){}
    if(msg) return {erro: msg, doTiny: true};
    return {erro: 'não foi possível falar com a função enviar-tiny '
                + `(${error.message}). Verifique o deploy no Supabase.`};
  }
  if(data && data.erro) return {erro: data.erro, doTiny: true};
  return {numero: data && data.numero};
}

async function reenviarTiny(codigo){
  const p = PEDIDOS.find(x => x.codigo === codigo);
  if(!p) return;
  const btn = document.querySelector('#fichaCorpo button.btn.azul');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando...'; }

  const r = await enviarAoTiny(codigo);
  if(r.erro){
    if(btn){ btn.disabled = false; btn.textContent = 'Enviar ao Tiny'; }
    erroFicha((r.doTiny ? 'Tiny recusou: ' : 'Falha no envio: ') + esc(r.erro));
    p.tiny_erro = r.erro;
    return;
  }
  p.tiny = r.numero; p.tiny_erro = null;
  fecharFicha(); telaPedidos();
}

  const n2  = n => (n/100).toFixed(2).replace('.',',');
  const n4  = n => (n/100).toFixed(4).replace('.',',');
  const kg3 = n => Number(n).toFixed(3).replace('.',',')
                    .replace(/\B(?=(\d{3})+(?!\d)(?=,))/g,'.');

  let somaQtd = 0, pesoLiq = 0;
  const linhas = p.itens.map(i => {
    const prod = PRODUTOS.find(x => x.sku === i.sku) || {};
    somaQtd += i.quantidade;
    pesoLiq += (prod.litragem || 0) * i.quantidade;
    return `
    <tr>
      <td>${esc(i.nome)}</td>
      <td>${esc(i.sku)}${prod.ean ? `<br><span class="sub">GTIN: ${esc(prod.ean)}</span>` : ''}

      <td class="d">${q4(i.quantidade)}</td>
      <td class="c">${esc(prod.unidade || 'UN')}</td>
      <td class="d">${n4(i.preco)}</td>
      <td class="d">${n2(i.preco * i.quantidade)}</td>
    </tr>`;
  }).join('');

  const pgtoValor = p.excedente ? n2(p.excedente) : '0,00';
  const pgtoForma = p.excedente
    ? esc(p.pagamento || '—')
    : 'Prêmio Cesta de Limpeza';
  const pgtoObs = p.excedente
    ? 'Diferença paga pelo colaborador'
    : 'Integralmente coberto pelo saldo';

  const obs = [

/* ------------------------------------------------------------- importação */

function pedirPlanilha(tipo){ admin.importando = tipo; el('arqImport').click(); }

async function lerPlanilha(input){
  const arq = input.files && input.files[0];
  input.value = '';
  if(!arq) return;
  try{
    const linhas = /\.xlsx?$/i.test(arq.name)
      ? await lerXlsx(arq) : lerCsv(await arq.text());
    admin.linhasImport = linhas;
    admin.previa = montarPrevia(admin.importando, linhas);
  }catch(e){
    return alert('Não foi possível ler a planilha: ' + (e.message || e));
  }
  if(!admin.previa.length)
    return alert('A planilha não tem linhas de dados, ou os títulos das colunas '
               + 'estão diferentes do modelo exportado.');
  telaPrevia();
}

/* Aceita o mesmo formato do "Exportar planilha": ponto e vírgula ou vírgula. */
function lerCsv(texto){
  texto = texto.replace(/^\uFEFF/, '');
  const cab = texto.split('\n')[0];
  const sep = (cab.match(/;/g)||[]).length >= (cab.match(/,/g)||[]).length ? ';' : ',';
  const linhas = [];
  let campo = '', linha = [], aspas = false;
  for(let k = 0; k < texto.length; k++){
    const ch = texto[k];
    if(aspas){
      if(ch === '"' && texto[k+1] === '"'){ campo += '"'; k++; }
      else if(ch === '"') aspas = false;
      else campo += ch;
    } else if(ch === '"') aspas = true;
    else if(ch === sep){ linha.push(campo); campo = ''; }
    else if(ch === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if(ch !== '\r') campo += ch;
  }
  if(campo || linha.length){ linha.push(campo); linhas.push(linha); }
  return paraObjetos(linhas);
}

async function lerXlsx(arq){
  if(!window.XLSX) await new Promise((ok, falha) => {
    const t = document.createElement('script');
    t.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    t.onload = ok; t.onerror = () => falha(new Error('sem conexão para ler .xlsx'));
    document.head.appendChild(t);
  });
  const wb = XLSX.read(await arq.arrayBuffer(), {type:'array'});
  const aba = wb.Sheets[wb.SheetNames[0]];
  return paraObjetos(XLSX.utils.sheet_to_json(aba, {header:1, raw:false, defval:''}));
}

function paraObjetos(linhas){
  linhas = linhas.filter(l => l.some(c => String(c).trim() !== ''));
  if(linhas.length < 2) return [];
  const chave = t => String(t).trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const cab = linhas[0].map(chave);
  return linhas.slice(1).map((l, n) => {
    const o = {_linha: n + 2};
    cab.forEach((c, k) => o[c] = String(l[k] == null ? '' : l[k]).trim());
    return o;
  });
}

const emCentavos = v => {
  const t = String(v == null ? '' : v)
    .replace(/[^0-9,.-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.');
  const n = parseFloat(t);
  return isFinite(n) ? Math.round(n * 100) : null;
};

/* ---------------------------------------------------- prévia da importação */

function montarPrevia(tipo, linhas){
  if(tipo === 'premio')   return previaPremio(linhas);
  if(tipo === 'produtos') return previaProdutos(linhas);
  return previaColaboradores(linhas);
}

function previaPremio(linhas){
  const comp = admin.competencia;
  return linhas.map(l => {
    const cpf = digitos(l['CPF']);
    const c = COLABORADORES.find(x => x.cpf === cpf);
    if(!c) return {tipo:'erro', nome: l['NOME'] || cpf || '(sem nome)',
                   antes:'CPF não cadastrado', depois:'linha ' + l._linha};
    const valor = emCentavos(l['VALOR PREMIO (R$)'] || l['VALOR PREMIO'] || l['VALOR']);
    if(valor === null || valor < 0)
      return {tipo:'erro', nome:c.nome, antes:'valor inválido', depois:'linha ' + l._linha};
    const atual = saldoDe(c, comp);
    return {tipo: atual === valor ? 'igual' : (atual ? 'alterado' : 'novo'),
            nome: c.nome, antes: brl(atual), depois: brl(valor),
            gravar: {cpf, competencia: comp, valor}};
  });
}

function previaColaboradores(linhas){
  const vistos = new Set();
  const saida = linhas.map(l => {
    const cpf = digitos(l['CPF']);
    const nome = (l['NOME'] || '').trim();
    if(cpf.length !== 11)
      return {tipo:'erro', nome: nome || '(sem nome)', antes:'CPF inválido',
              depois:'linha ' + l._linha};
    if(!nome) return {tipo:'erro', nome:cpf, antes:'sem nome', depois:'linha ' + l._linha};
    vistos.add(cpf);
    const c = COLABORADORES.find(x => x.cpf === cpf);
    const ehAdmin = /ADMIN/i.test(l['PERFIL'] || '');
    const ativo = !/INATIVO/i.test(l['SITUACAO'] || 'ATIVO');
    const gravar = {cpf, nome, ativo, admin: ehAdmin};
    if(!c) return {tipo:'novo', nome, antes:'—',
                   depois: ativo ? 'ativo' : 'inativo', gravar};
    const mudou = c.nome !== nome || !!c.ativo !== ativo || !!c.admin !== ehAdmin;
    return {tipo: mudou ? 'alterado' : 'igual', nome,
            antes: c.ativo ? 'ativo' : 'inativo',
            depois: ativo ? 'ativo' : 'inativo', gravar};
  });
  if(admin.inativarAusentes)
  COLABORADORES.filter(c => c.ativo && !vistos.has(c.cpf)).forEach(c =>
    saida.push({tipo:'inativo', nome:c.nome, antes:'ativo', depois:'inativo',
                gravar:{cpf:c.cpf, nome:c.nome, ativo:false, admin: !!c.admin}}));
  return saida;
}

function previaProdutos(linhas){
  return linhas.map(l => {
    const sku = (l['CODIGO'] || '').trim();
    const p = PRODUTOS.find(x => x.sku === sku);
    if(!p) return {tipo:'erro', nome: l['DESCRICAO'] || sku || '(sem código)',
                   antes:'código não cadastrado', depois:'linha ' + l._linha};
    const preco = emCentavos(l['PRECO']);
    if(preco === null || preco <= 0)
      return {tipo:'erro', nome:p.nome, antes:'preço inválido', depois:'linha ' + l._linha};
    const ativo = !/INATIVO/i.test(l['SITUACAO'] || 'ATIVO');
    const nome  = (l['DESCRICAO'] || p.nome).trim();
    const linha = (l['CATEGORIA'] || p.linha).trim().toUpperCase();
    const gravar = {sku, nome, preco, linha, ativo, unidade:p.unidade, ncm:p.ncm,
                    ean:p.ean, litragem:p.litragem, ordem:p.ordem,
                    foto_url:p.foto_url || null};
    if(!!p.ativo && !ativo)
      return {tipo:'inativo', nome:p.nome, antes:'ativo', depois:'inativo', gravar};
    const mudou = p.preco !== preco || p.nome !== nome || p.linha !== linha;
    return {tipo: mudou ? 'alterado' : 'igual', nome:p.nome,
            antes: brl(p.preco), depois: brl(preco), gravar};
  });
}

    </div>
    <p class="nota">Nada é gravado antes de você confirmar. Linhas sem mudança são ignoradas.</p>`;

async function confirmarImportacao(){
  const linhas = (admin.previa || []).filter(x => x.gravar && x.tipo !== 'igual');
  const tipo = admin.importando;
  if(!linhas.length){
    admin.previa = null; admin.importando = null;
    return pintarAdmin();
  }

  const btn = document.querySelector('button.btn.azul[onclick*="confirmarImportacao"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Gravando...'; }

  const dados = linhas.map(x => x.gravar);
  let erro = null;
  if(tipo === 'premio')
    ({error: erro} = await sb.from('saldos').upsert(dados, {onConflict:'cpf,competencia'}));
  else if(tipo === 'colaboradores')
    ({error: erro} = await sb.from('colaboradores').upsert(dados, {onConflict:'cpf'}));
  else
    ({error: erro} = await sb.from('produtos').upsert(dados, {onConflict:'sku'}));

  if(erro){
    if(btn){ btn.disabled = false; btn.textContent = 'Confirmar e gravar'; }
    return avisarErro(erro);
  }

  try{ await carregarDados(); }catch(e){ avisarErro(e); }
  admin.previa = null; admin.importando = null; admin.linhasImport = null;
  pintarAdmin();
  alert(`${dados.length} ${dados.length === 1 ? 'linha gravada' : 'linhas gravadas'}.`);
}

  el('fichaCorpo').innerHTML = '<div id="erroFicha"></div>' + corpo;

  el('ficha').classList.add('aberta');
}

function fecharFicha(){
  el('ficha').classList.remove('aberta');
  admin.editando = null; admin.fotoNova = null;
}

function erroFicha(m){ el('erroFicha').innerHTML = `<div class="aviso">${esc(m)}</div>`; }

const passaFiltro = x =>
  admin.filtro === 'todos' || (admin.filtro === 'ativos' ? x.ativo : !x.ativo);
const sufixoFiltro = () =>
  admin.filtro === 'todos' ? '' : '-' + admin.filtro;

function baixarCsv(nome, cabecalho, linhas){
  const escapar = v => `"${String(v).replace(/"/g,'""')}"`;
  const texto = '\uFEFF' + [cabecalho, ...linhas].map(l => l.map(escapar).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([texto], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}


document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(estado.ampliado) fecharVisor();
  else if(el('painel').classList.contains('aberto')) fecharTudo();
});
